name: Deploy HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar via FTPS no public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: br12.hostgator.com.br
          username: deploy@viniciosribeiro.com.br
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            README.md
